<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>东北刨幺414 - 调试版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            font-family: 'ZCOOL XiaoWei', 'PingFang SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* Canvas container */
        .canvas {
            width: 667px;
            height: 375px;
            overflow: hidden;
            position: relative;
            border-radius: 14px;
            box-shadow: 0 0 0 1.5px rgba(255,255,255,.12), 0 20px 60px rgba(0,0,0,.7);
        }

        /* ══════════════════════════════════════
           SHARED BACKGROUND SCENE
        ══════════════════════════════════════ */
        .scene { position: absolute; inset: 0; overflow: hidden; }

        /* Sky gradient */
        .sky {
            position: absolute; inset: 0;
            background: linear-gradient(180deg,
                #4EC0E8 0%, #72CEE8 12%, #A8DCF0 22%,
                #D8EDF8 32%, #F0E8D0 48%,
                #F8D888 62%, #F0B050 76%, #E07838 88%, #C05830 100%);
        }

        /* Sun glow */
        .sun {
            position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
            width: 56px; height: 56px; border-radius: 50%;
            background: radial-gradient(circle, #FFF8C0 0%, #FFE566 40%, #FFBE3A 70%, transparent 100%);
            filter: blur(2px);
            box-shadow: 0 0 40px 20px rgba(255,200,60,.35), 0 0 80px 40px rgba(255,160,30,.15);
        }

        /* Clouds */
        .cloud { position: absolute; opacity: .85; }
        .cloud-body {
            background: linear-gradient(180deg, #fff 0%, #F0ECE0 100%);
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
        }
        .c1 { top: 22px; left: 60px; }
        .c1 .cloud-body { width: 90px; height: 26px; }
        .c1::before { content: ''; position: absolute; width: 44px; height: 30px;
            background: linear-gradient(180deg, #fff, #F0ECE0); border-radius: 50%; top: -14px; left: 16px;
            box-shadow: inset 0 -4px 8px rgba(0,0,0,.06); }
        .c1::after { content: ''; position: absolute; width: 30px; height: 22px;
            background: linear-gradient(180deg, #fff, #F0ECE0); border-radius: 50%; top: -8px; left: 46px; }

        .c2 { top: 14px; right: 80px; }
        .c2 .cloud-body { width: 70px; height: 20px; }
        .c2::before { content: ''; position: absolute; width: 36px; height: 26px;
            background: linear-gradient(180deg, #fff, #EEE8DC); border-radius: 50%; top: -12px; left: 12px; }
        .c2::after { content: ''; position: absolute; width: 24px; height: 18px;
            background: linear-gradient(180deg, #fff, #EEE8DC); border-radius: 50%; top: -6px; left: 38px; }

        /* City skyline SVG */
        .city-layer { position: absolute; bottom: 60px; left: 0; right: 0; height: 160px; pointer-events: none; }

        /* Water lake */
        .lake {
            position: absolute; bottom: 54px; left: 140px; right: 140px; height: 22px;
            background: linear-gradient(180deg, rgba(160,210,240,.6), rgba(120,180,220,.35));
            border-radius: 50%; filter: blur(1.5px);
        }
        .lake::before { content: ''; position: absolute; inset: 4px 20px;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, rgba(255,255,180,.3), transparent); }

        /* Ground */
        .ground {
            position: absolute; bottom: 0; left: 0; right: 0; height: 62px;
            background: linear-gradient(180deg, #7CC860 0%, #5AAA42 40%, #3D8A2A 100%);
        }
        .ground::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px;
            background: linear-gradient(180deg, rgba(160,220,120,.4), transparent); }

        /* Cherry blossom trees */
        .ctree { position: absolute; bottom: 54px; }
        .ctree-trunk { width: 16px; height: 64px; margin: 0 auto;
            background: linear-gradient(90deg, #7A4A20, #5A3010, #7A4A20);
            border-radius: 6px 6px 3px 3px; }
        .ctree-top { position: absolute; bottom: 56px; }
        .ctree-l { left: 6px; }
        .ctree-l .ctree-top { left: -10px; }
        .ctree-r { right: 6px; }
        .ctree-r .ctree-top { right: -10px; }

        /* ══════════════════════════════════════
           TOPBAR
        ══════════════════════════════════════ */
        .topbar {
            position: absolute; top: 0; left: 0; right: 0; height: 40px; z-index: 30;
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
            background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 100%);
        }
        .tb-pill {
            background: rgba(0,0,0,.42); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,.22);
            color: #fff; font-size: 10px; padding: 4px 11px; border-radius: 10px; letter-spacing: .5px;
            display: flex; align-items: center; gap: 5px;
        }
        .tb-pill .em { font-size: 12px; }
        .round-badge {
            background: linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.12));
            backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,.38);
            color: #fff; font-size: 13px; font-weight: bold; padding: 5px 18px; border-radius: 13px;
            letter-spacing: 2px; font-family: 'Noto Serif SC', serif;
            box-shadow: 0 2px 10px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.2);
        }
        .score-row { display: flex; gap: 6px; }
        .sc-chip {
            padding: 4px 11px; border-radius: 10px; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; gap: 4px; backdrop-filter: blur(6px);
        }
        .sc-chip.us { background: rgba(30,180,100,.3); border: 1px solid rgba(50,220,130,.5); color: #3DDD84; }
        .sc-chip.them { background: rgba(220,50,50,.3); border: 1px solid rgba(255,80,80,.5); color: #FF6666; }
        .sc-dot { width: 6px; height: 6px; border-radius: 50%; }
        .sc-chip.us .sc-dot { background: #3DDD84; box-shadow: 0 0 5px #3DDD84; }
        .sc-chip.them .sc-dot { background: #FF6666; box-shadow: 0 0 5px #FF6666; }

        /* ══════════════════════════════════════
           3D TABLE
        ══════════════════════════════════════ */
        .table-wrap {
            position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 500px; height: 180px; z-index: 12;
        }
        .table-wood {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 100% 100% at 50% 0%, #D4956A 0%, #B8723E 30%, #8B4A1E 60%, #6B320E 100%);
            border-radius: 50%;
            box-shadow: 0 -3px 0 rgba(255,200,140,.4), 0 8px 0 rgba(60,20,0,.5), 0 12px 30px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,200,140,.25);
        }
        .table-wood::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-linear-gradient(88deg, transparent, transparent 6px, rgba(0,0,0,.04) 6px, rgba(0,0,0,.04) 7px);
        }
        .table-wood::after {
            content: ''; position: absolute; top: 6px; left: 10px; right: 10px; height: 12px;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255,220,160,.3), transparent);
        }
        .table-felt {
            position: absolute; inset: 16px;
            background: radial-gradient(ellipse 80% 70% at 50% 35%, #2E8B42 0%, #1E6830 50%, #124820 80%, #0A3016 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 30px rgba(0,0,0,.4), inset 0 4px 8px rgba(0,0,0,.2);
        }
        .table-felt::after {
            content: ''; position: absolute; inset: 12px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.06);
        }

        /* ══════════════════════════════════════
           PLAY ZONE (on table)
        ══════════════════════════════════════ */
        .play-zone {
            position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
            z-index: 20; text-align: center;
        }
        .pz-who {
            font-size: 10px; color: rgba(255,255,180,.85);
            background: rgba(0,0,0,.4); padding: 2px 9px; border-radius: 7px;
            margin-bottom: 5px; display: inline-block; letter-spacing: .5px;
        }
        .pz-who em { color: #FFD700; font-style: normal; font-weight: bold; }
        .pz-cards { display: flex; gap: 3px; justify-content: center; align-items: flex-end; }
        .pc {
            background: linear-gradient(155deg, #FFFEF5 0%, #F8F2DC 100%);
            border-radius: 5px; border: 1px solid #DDD;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 4px 10px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.5), inset 0 1px 0 rgba(255,255,255,.8);
            animation: dealUp .35s cubic-bezier(.34,1.3,.64,1) backwards;
        }
        .pc.big { width: 38px; height: 56px; }
        .pc.sm { width: 30px; height: 44px; }
        .pc:nth-child(1) { animation-delay: 0s; }
        .pc:nth-child(2) { animation-delay: .06s; }
        .pc:nth-child(3) { animation-delay: .12s; }
        .pc:nth-child(4) { animation-delay: .18s; }
        .pc:nth-child(5) { animation-delay: .24s; }
        .pc:nth-child(6) { animation-delay: .30s; }
        @keyframes dealUp { from { transform: translateY(-24px) scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
        .pc .rk { font-weight: 900; line-height: 1.05; font-family: 'Noto Serif SC', serif; }
        .pc.big .rk { font-size: 18px; }
        .pc.sm .rk { font-size: 14px; }
        .pc .st { font-size: 10px; margin-top: -1px; }
        .pc.sm .st { font-size: 8px; }
        .pc.r .rk, .pc.r .st { color: #BB0000; }
        .pc.b .rk, .pc.b .st { color: #111; }
        .pc.joker-pc { background: linear-gradient(155deg, #F0E8FF 0%, #E0D0FF 100%); }
        .pc.joker-pc .rk { font-size: 11px; color: #6600CC; }
        .pz-tag {
            margin-top: 6px; font-size: 11px; color: #FFD700;
            background: rgba(255,200,0,.18); border: 1px solid rgba(255,200,0,.4);
            padding: 2px 12px; border-radius: 9px; display: inline-block; letter-spacing: 1px;
        }

        /* 不出 big text */
        .no-play {
            font-family: 'Noto Serif SC', serif; font-size: 36px; font-weight: 900;
            color: #FF3300;
            text-shadow: 0 0 20px rgba(255,60,0,.8), 3px 3px 0 rgba(120,0,0,.4);
            animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes popIn { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }

        /* ══════════════════════════════════════
           PLAYERS
        ══════════════════════════════════════ */
        .player { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 22; }

        /* Portrait frame */
        .portrait {
            position: relative; width: 58px; height: 58px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            overflow: hidden;
        }
        .portrait::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; z-index: -1; }
        .portrait.us-p::before {
            background: conic-gradient(#3DDD84, #28C870, #1AAA58, #3DDD84);
            animation: spinRing 4s linear infinite;
        }
        .portrait.them-p::before {
            background: conic-gradient(#FF5555, #DD3333, #AA1111, #FF5555);
            animation: spinRing 4s linear infinite reverse;
        }
        .portrait.active-p::before {
            background: conic-gradient(#FFD700, #FFB300, #FF8C00, #FFD700);
            animation: spinRing 1.5s linear infinite;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }
        .portrait::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: inherit; z-index: 0; }
        .port-emoji { position: relative; z-index: 1; font-size: 28px; }
        .port-shine {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,.25) 0%, transparent 60%);
            z-index: 2; pointer-events: none;
        }
        .portrait.active-p { filter: drop-shadow(0 0 8px rgba(255,210,0,.9)); }

        .p-badge {
            position: absolute; bottom: -3px; right: -3px; z-index: 3;
            background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000;
            font-size: 9px; font-weight: 900;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid rgba(0,0,0,.5);
            box-shadow: 0 2px 4px rgba(0,0,0,.4);
        }

        .pname {
            font-size: 10px; white-space: nowrap;
            background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.14);
            padding: 2px 8px; border-radius: 7px; letter-spacing: .3px;
        }
        .pname.us-n { color: #3DDD84; }
        .pname.them-n { color: #FF7777; }

        /* Mini card fan shown by opponents */
        .card-fan { display: flex; margin-top: 2px; }
        .cf {
            width: 10px; height: 16px;
            background: linear-gradient(135deg, #3D6EC0, #2450A0);
            border-radius: 2px; border: 1px solid rgba(255,255,255,.28);
            margin: 0 -1.5px;
            box-shadow: 1px 1px 3px rgba(0,0,0,.4);
        }
        .cf:nth-child(odd) { transform: rotate(-3deg); }
        .cf:nth-child(even) { transform: rotate(3deg); }

        /* Positions */
        .p-tl { top: 38px; left: 58px; }
        .p-tc { top: 26px; left: 50%; transform: translateX(-50%); }
        .p-tr { top: 38px; right: 58px; }
        .p-bl { bottom: 105px; left: 60px; }
        .p-br { bottom: 105px; right: 60px; }

        /* ══════════════════════════════════════
           MY HAND AREA
        ══════════════════════════════════════ */
        .my-area {
            position: absolute; bottom: 0; left: 0; right: 0; height: 112px; z-index: 25;
            background: linear-gradient(180deg,
                transparent 0%, rgba(16,8,2,.7) 14%, rgba(10,5,1,.92) 30%, rgba(8,4,0,.97) 100%);
            display: flex; flex-direction: column; padding: 4px 8px 2px; gap: 0;
        }
        .action-row {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0; height: 36px;
        }

        /* My avatar */
        .my-portrait { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .my-av {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(145deg, #1a3020, #0d1a10);
            position: relative; display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        .my-av::before {
            content: ''; position: absolute; inset: -2.5px; border-radius: 50%; z-index: -1;
            background: conic-gradient(#3DDD84, #1AAA58, #3DDD84);
            animation: spinRing 4s linear infinite;
        }
        .my-av::after { content: ''; position: absolute; inset: 2.5px; border-radius: 50%;
            background: linear-gradient(145deg, #1a3020, #0d1a10); z-index: -1; }
        .my-nm { font-size: 9px; color: #3DDD84; letter-spacing: .5px; }

        /* Score hint */
        .score-hint { flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; align-items: center; }
        .sh-row {
            display: flex; align-items: center; gap: 3px;
            background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
            padding: 2px 7px; border-radius: 7px; font-size: 9px; color: #aaa;
        }
        .sh-row .sv { color: #FFD700; font-weight: bold; margin-left: 2px; }

        /* Hand cards */
        .hand {
            flex: 1; display: flex; align-items: flex-end;
            overflow-x: auto; overflow-y: visible;
            /* 自定义细滚动条 */
            scrollbar-width: thin; scrollbar-color: rgba(255,200,0,.3) transparent;
        }
        .hand::-webkit-scrollbar { height: 3px; }
        .hand::-webkit-scrollbar-track { background: transparent; }
        .hand::-webkit-scrollbar-thumb { background: rgba(255,200,0,.3); border-radius: 2px; }
        /* 让canvas底部不裁剪手牌的选中上浮 */
        .canvas { overflow: visible !important; }
        .hcard {
            width: 40px; height: 60px;
            background: linear-gradient(158deg, #FFFFFA 0%, #F8F3E2 70%, #F0EAD0 100%);
            border-radius: 5px; border: 1px solid rgba(180,160,100,.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 4px 8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
            margin: 0 -5px; flex-shrink: 0; cursor: pointer;
            transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
            position: relative;
        }
        .hcard:hover { transform: translateY(-8px); z-index: 2; }
        .hcard .hr { font-weight: 900; line-height: 1; font-family: 'Noto Serif SC', serif; font-size: 16px; }
        .hcard .hs { font-size: 9px; margin-top: -1px; }
        .hcard.r .hr, .hcard.r .hs { color: #CC0000; }
        .hcard.b .hr, .hcard.b .hs { color: #111; }
        .hcard.sel {
            transform: translateY(-18px) !important; z-index: 3;
            box-shadow: 0 0 18px rgba(255,210,0,.85), 2px 2px 8px rgba(0,0,0,.45);
            border-color: #FFD700;
            background: linear-gradient(158deg, #FFFFF0, #FFF8C0, #FFF0A0);
        }
        .hcard.sel::after {
            content: '✓'; position: absolute; top: 1px; right: 3px;
            font-size: 9px; color: #CC9900; font-weight: 900;
        }
        .hcard.joker { background: linear-gradient(158deg, #F0E8FF, #E0D0FF); }
        .hcard.joker .hr { font-size: 9px; font-weight: 900; color: #6600CC; }
        .hcard.sel.joker { background: linear-gradient(158deg, #F8F0FF, #EAD8FF); border-color: #9933FF; }

        /* Score label on card */
        .sc-label {
            position: absolute; bottom: 2px; right: 2px;
            padding: 0 2px; border-radius: 2px; font-size: 7px; font-weight: bold; line-height: 1.4;
        }
        .sc-label.s5 { background: #FF8C00; color: #fff; }
        .sc-label.s10 { background: #CC0000; color: #fff; }

        /* ─── 手牌双区域 ─── */
        /* 上半区：点击/滑动选牌 */
        .card-top-zone {
            position: absolute; top: 0; left: 0; right: 0; height: 56%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding-top: 4px;
            cursor: pointer; z-index: 2; user-select: none;
        }
        /* 下半区：拖拽换位 */
        .card-bot-zone {
            position: absolute; bottom: 0; left: 0; right: 0; height: 44%;
            cursor: grab; z-index: 2;
            border-top: 1px dashed rgba(150,130,80,.15);
        }
        .card-bot-zone:active { cursor: grabbing; }
        .hcard.drag-over { border-color: #FFD700 !important; transform: scale(1.06) !important; z-index: 10 !important; }

        /* Action buttons */
        .acts { display: flex; flex-direction: row; gap: 6px; margin-left: auto; }
        .act-btn {
            height: 28px; padding: 0 14px; border-radius: 14px; border: none; cursor: pointer;
            font-size: 12px; font-weight: bold; letter-spacing: 2px;
            font-family: 'ZCOOL XiaoWei', 'PingFang SC', sans-serif;
            transition: transform .12s, box-shadow .12s, opacity .12s;
        }
        .act-btn:active { transform: scale(.93); }
        .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-play {
            background: linear-gradient(135deg, #FFD700 0%, #FFA000 60%, #FF7000 100%);
            color: #000; box-shadow: 0 3px 12px rgba(255,140,0,.5), 0 1px 0 rgba(255,255,255,.3) inset;
        }
        .btn-pass {
            background: linear-gradient(135deg, #2a3040, #1a2030);
            color: #778; border: 1px solid rgba(255,255,255,.1);
        }

        .emoji-btn {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #1a5030, #0f3820);
            border: 1.5px solid rgba(61,221,132,.35);
            color: #3DDD84; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,200,100,.2);
        }

        /* Badge alert when ≤5 cards */
        .p-badge.badge-alert {
            background: #FF3333 !important; color: #fff !important;
            box-shadow: 0 0 8px rgba(255,50,50,.7);
            animation: badgePulse 1s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ══════════════════════════════════════
           GAME LOG
        ══════════════════════════════════════ */
        .game-log {
            position: absolute; top: 45px; right: 10px; width: 160px; max-height: 120px;
            background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
            padding: 6px 8px; overflow-y: auto; z-index: 35;
            font-size: 10px; color: rgba(255,255,255,.85);
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.08); line-height: 1.3; }
        .log-entry:last-child { border-bottom: none; }

        /* ══════════════════════════════════════
           DEAL BUTTON
        ══════════════════════════════════════ */
        .deal-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 50;
            padding: 14px 36px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA000 50%, #FF6000 100%);
            border: none; border-radius: 28px;
            color: #000; font-size: 18px; font-weight: bold; letter-spacing: 3px;
            font-family: 'ZCOOL XiaoWei', 'PingFang SC', sans-serif;
            cursor: pointer;

    <script>
        // ==================== Card Engine ====================
        const RANK_ORDER = ['4', '5', '6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A', '2', '3', '小王', '大王'];
        const SCORE_MAP = { '5': 5, '10': 10, 'K': 10 };
        const SUITS = ['♠', '♥', '♣', '♦'];

        function createDeck() {
            const deck = [];
            // 3 decks of regular cards
            for (let d = 0; d < 3; d++) {
                for (const suit of SUITS) {
                    for (const rank of RANK_ORDER.slice(0, 13)) {
                        deck.push({ rank, suit, id: `${rank}${suit}_${d}_${Math.random().toString(36).substr(2, 5)}` });
                    }
                }
            }
            // 每副牌1张小王+1张大王，共3副=6张王
            for (let d = 0; d < 3; d++) {
                deck.push({ rank: '小王', suit: 'joker', id: `小王_${d}_${Math.random().toString(36).substr(2, 5)}` });
                deck.push({ rank: '大王', suit: 'joker', id: `大王_${d}_${Math.random().toString(36).substr(2, 5)}` });
            }
            return deck;
        }

        function shuffle(deck) {
            const shuffled = [...deck];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function rankValue(rank) {
            return RANK_ORDER.indexOf(rank);
        }

        function analyzePlay(cards) {
            if (!cards || cards.length === 0) {
                return { type: 'invalid', lu: 0, value: 0, valid: false };
            }

            const sorted = [...cards].sort((a, b) => rankValue(a.rank) - rankValue(b.rank));
            const ranks = sorted.map(c => c.rank);
            const rankCounts = {};
            ranks.forEach(r => rankCounts[r] = (rankCounts[r] || 0) + 1);

            // Single card
            if (cards.length === 1) {
                return { type: 'single', lu: 1, value: rankValue(cards[0].rank), valid: true };
            }

            // Check for Yao (幺): 1 Ace + N*4s (N>=2)
            const aceCount = rankCounts['A'] || 0;
            const fourCount = rankCounts['4'] || 0;
            if (aceCount === 1 && fourCount >= 2 && cards.length === 1 + fourCount) {
                const otherCards = ranks.filter(r => r !== 'A' && r !== '4');
                if (otherCards.length === 0) {
                    return { type: 'yao', lu: fourCount * 2, value: fourCount, valid: true };
                }
            }

            // Check for pairs (2路)
            if (cards.length === 2) {
                if (ranks[0] === ranks[1]) {
                    return { type: 'pair', lu: 2, value: rankValue(ranks[0]), valid: true };
                }
                // Joker bomb combination
                if (ranks.includes('小王') && ranks.includes('大王')) {
                    return { type: 'joker_bomb', lu: 4, value: 100, valid: true };
                }
                return { type: 'invalid', lu: 0, value: 0, valid: false };
            }

            // Check for bomb (N same rank, N>=3)
            const uniqueRanks = Object.keys(rankCounts);
            if (uniqueRanks.length === 1) {
                const count = rankCounts[uniqueRanks[0]];
                if (count >= 3) {
                    return { type: 'bomb', lu: count, value: rankValue(uniqueRanks[0]), valid: true };
                }
            }

            // Check for straight (N consecutive, N>=3, no jokers)
            if (cards.length >= 3 && !ranks.some(r => r === '小王' || r === '大王')) {
                const values = ranks.map(r => rankValue(r)).sort((a, b) => a - b);
                let isStraight = true;
                for (let i = 1; i < values.length; i++) {
                    if (values[i] !== values[i - 1] + 1) {
                        isStraight = false;
                        break;
                    }
                }
                const uniqueValues = [...new Set(values)];
                if (isStraight && uniqueValues.length === values.length) {
                    return { type: 'straight', lu: cards.length, value: values[values.length - 1], valid: true };
                }
            }

            // Check for dragon (N consecutive pairs, N>=3)
            if (cards.length >= 6 && cards.length % 2 === 0 && !ranks.some(r => r === '小王' || r === '大王')) {
                const pairCount = cards.length / 2;
                const pairs = [];
                let validDragon = true;
                const rankVals = {};
                for (const r of ranks) {
                    rankVals[r] = (rankVals[r] || 0) + 1;
                }
                for (const [rank, count] of Object.entries(rankVals)) {
                    if (count !== 2) {
                        validDragon = false;
                        break;
                    }
                    pairs.push(rankValue(rank));
                }
                if (validDragon && pairs.length >= 3) {
                    pairs.sort((a, b) => a - b);
                    let consecutive = true;
                    for (let i = 1; i < pairs.length; i++) {
                        if (pairs[i] !== pairs[i - 1] + 1) {
                            consecutive = false;
                            break;
                        }
                    }
                    if (consecutive) {
                        return { type: 'dragon', lu: cards.length, value: pairs[pairs.length - 1], valid: true };
                    }
                }
            }

            // Check for joker bomb with multiple jokers
            const smallJokerCount = ranks.filter(r => r === '小王').length;
            const bigJokerCount = ranks.filter(r => r === '大王').length;
            if (smallJokerCount + bigJokerCount === cards.length && cards.length >= 2) {
                return {
                    type: 'joker_bomb',
                    lu: smallJokerCount * 1.5 + bigJokerCount * 2.5,
                    value: bigJokerCount * 10 + smallJokerCount,
                    valid: true
                };
            }

            return { type: 'invalid', lu: 0, value: 0, valid: false };
        }

        function canBeat(newPlay, lastPlay) {
            if (!lastPlay || !lastPlay.analysis) return true;

            const newAnalysis = newPlay.analysis || analyzePlay(newPlay.cards);
            const lastAnalysis = lastPlay.analysis;

            if (!newAnalysis.valid) return false;

            if (newAnalysis.lu > lastAnalysis.lu) return true;
            if (newAnalysis.lu < lastAnalysis.lu) return false;

            const typePriority = { 'yao': 3, 'joker_bomb': 2, 'bomb': 1, 'dragon': 1, 'straight': 1, 'pair': 1, 'single': 1 };
            const newPriority = typePriority[newAnalysis.type] || 0;
            const lastPriority = typePriority[lastAnalysis.type] || 0;

            if (newPriority > lastPriority) return true;
            if (newPriority < lastPriority) return false;

            if ((newAnalysis.type === 'straight' || newAnalysis.type === 'dragon') &&
                newPlay.cards.length !== lastPlay.cards.length) {
                return false;
            }

            return newAnalysis.value > lastAnalysis.value;
        }

        function calcScore(cards) {
            let score = 0;
            for (const card of cards) {
                score += SCORE_MAP[card.rank] || 0;
            }
            return score;
        }

        // ==================== Game State ====================
        const SEATS = ['player', 'bot1', 'bot2', 'bot3', 'bot4', 'bot5'];
        const SEAT_NAMES = {
            'player': '我',
            'bot1': '对手1',
            'bot2': '队友2',
            'bot3': '对手3',
            'bot4': '队友4',
            'bot5': '对手5'
        };
        const SEAT_EMOJIS = {
            'player': '🙂',
            'bot1': '😤',
            'bot2': '👩',
            'bot3': '👨',
            'bot4': '🧑',
            'bot5': '👴'
        };

        function getTeam(seat) {
            const idx = SEATS.indexOf(seat);
            return idx % 2 === 0 ? 'A' : 'B';
        }

        let gameState = {
            seats: SEATS,
            hands: {},
            currentTurn: 'player',
            lastPlay: null,
            passCount: 0,
            scoreA: 0,
            scoreB: 0,
            firstFinishTeam: null,
            borrowLight: null,
            log: [],
            finished: [],
            selectedCards: [],
            round: 1,
            gameStarted: false
        };

        // ==================== UI Functions ====================
        function log(message) {
            gameState.log.push(message);
            if (gameState.log.length > 20) gameState.log.shift();
            updateLog();
        }

        function updateLog() {
            const logEl = document.getElementById('gameLog');
            logEl.innerHTML = gameState.log.slice(-8).map(msg =>
                `<div class="log-entry">${msg}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function renderPlayCard(card) {
            const isRed = card.suit === '♥' || card.suit === '♦';
            const isJoker = card.suit === 'joker';
            const rankDisplay = card.rank;
            const suitDisplay = isJoker ? '' : card.suit;
            return `<div class="pc big ${isRed ? 'r' : 'b'} ${isJoker ? 'joker-pc' : ''}">
                <span class="rk">${rankDisplay}</span>
                ${suitDisplay ? `<span class="st">${suitDisplay}</span>` : ''}
            </div>`;
        }

        // ── 双区域交互状态 ──
        let _sweeping = false;       // 正在滑动多选
        let _sweepAdding = null;     // 本次滑动是"选中"还是"取消"
        let _dragSrcId = null;       // 拖拽换位起点
        let _dragTgtId = null;       // 触摸拖拽换位终点

        function renderHandCard(card, selected, marginPx) {
            const isRed = card.suit === '♥' || card.suit === '♦';
            const isJoker = card.suit === 'joker';
            const isScore = !!SCORE_MAP[card.rank];
            const scoreLabel = isScore
                ? `<div class="sc-label ${card.rank === '5' ? 's5' : 's10'}">${SCORE_MAP[card.rank]}</div>` : '';
            const mStyle = marginPx !== undefined ? `style="margin:0 ${marginPx}px"` : '';
            return `<div class="hcard ${isRed ? 'r' : 'b'} ${isJoker ? 'joker' : ''} ${selected ? 'sel' : ''}"
                        data-cid="${card.id}" ${mStyle}>
                <div class="card-top-zone"
                    onmousedown="cardTopDown(event,'${card.id}')"
                    onmouseenter="cardTopEnter(event,'${card.id}')"
                    ontouchstart="cardTopDown(event,'${card.id}')">
                    <span class="hr">${card.rank}</span>
                    ${!isJoker ? `<span class="hs">${card.suit}</span>` : ''}
                    ${scoreLabel}
                </div>
                <div class="card-bot-zone"
                    draggable="true"
                    ondragstart="cardDragStart(event,'${card.id}')"
                    ondragover="cardDragOver(event,'${card.id}')"
                    ondrop="cardDrop(event,'${card.id}')"
                    ondragleave="cardDragLeave(event)"
                    ontouchstart="cardBotTouchStart(event,'${card.id}')">
                </div>
            </div>`;
        }

        function updatePlayerHand() {
            const container = document.getElementById('playerHand');
            const hand = gameState.hands.player || [];

            // 排序：从大到小（大王在左，4在右）
            const sorted = gameState.playerHandOrder
                ? gameState.playerHandOrder.filter(c => hand.some(h => h.id === c.id))
                : [...hand].sort((a, b) => rankValue(b.rank) - rankValue(a.rank));

            // 动态计算重叠量，让所有牌都在可视范围内
            const CARD_W = 40;
            const availW = container.offsetWidth || 360;
            const n = sorted.length;
            let margin = -5; // 每侧默认 -5px
            if (n > 1) {
                // total = n*CARD_W + 2*(n-1)*margin
                const needed = (n * CARD_W - availW) / (2 * (n - 1));
                if (needed > 5) margin = -Math.min(needed, 16); // 最多重叠到只剩 8px 可见
            }

            container.innerHTML = sorted.map(card => {
                const isSelected = gameState.selectedCards.some(c => c.id === card.id);
                return renderHandCard(card, isSelected, margin);
            }).join('');

        }

        // ── 上半区：点击选牌 / 按住滑动多选 ──
        function cardTopDown(e, cid) {
            if (!gameState.gameStarted || gameState.currentTurn !== 'player') return;
            e.preventDefault();
            _sweeping = true;
            // 确定本次滑动操作是"加选"还是"取消"
            const alreadySel = gameState.selectedCards.some(c => c.id === cid);
            _sweepAdding = !alreadySel;
            _toggleSelectById(cid, _sweepAdding);
        }
        function cardTopEnter(e, cid) {
            if (!_sweeping) return;
            _toggleSelectById(cid, _sweepAdding);
        }
        document.addEventListener('mouseup', () => { _sweeping = false; _sweepAdding = null; });

        // ── 触摸：下半区拖拽换位起点 ──
        function cardBotTouchStart(e, cid) {
            e.preventDefault();
            _dragSrcId = cid;
            _dragTgtId = null;
        }

        // ── 触摸：全局 move — 同时处理滑动多选 & 拖拽换位 ──
        document.addEventListener('touchmove', function(e) {
            if (!_sweeping && !_dragSrcId) return;
            e.preventDefault();
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);

            if (_sweeping) {
                const topZone = el?.closest?.('.card-top-zone');
                if (topZone) {
                    const cid = topZone.closest('.hcard')?.dataset?.cid;
                    if (cid) _toggleSelectById(cid, _sweepAdding);
                }
            }

            if (_dragSrcId) {
                document.querySelectorAll('.hcard.drag-over').forEach(n => n.classList.remove('drag-over'));
                const hcard = el?.closest?.('.hcard');
                if (hcard && hcard.dataset.cid !== _dragSrcId) {
                    hcard.classList.add('drag-over');
                    _dragTgtId = hcard.dataset.cid;
                } else if (!hcard) {
                    _dragTgtId = null;
                }
            }
        }, { passive: false });

        // ── 触摸：全局 end — 确认拖拽换位 & 结束滑动多选 ──
        document.addEventListener('touchend', function() {
            if (_dragSrcId && _dragTgtId) {
                const hand = gameState.hands.player || [];
                if (!gameState.playerHandOrder) {
                    gameState.playerHandOrder = [...hand].sort((a, b) => rankValue(b.rank) - rankValue(a.rank));
                }
                const arr = gameState.playerHandOrder;
                const si = arr.findIndex(c => c.id === _dragSrcId);
                const ti = arr.findIndex(c => c.id === _dragTgtId);
                if (si >= 0 && ti >= 0) {
                    const [moved] = arr.splice(si, 1);
                    arr.splice(ti, 0, moved);
                    updatePlayerHand();
                }
                document.querySelectorAll('.hcard.drag-over').forEach(n => n.classList.remove('drag-over'));
            }
            _sweeping = false; _sweepAdding = null;
            _dragSrcId = null; _dragTgtId = null;
        });

        function _toggleSelectById(cid, add) {
            const card = gameState.hands.player.find(c => c.id === cid);
            if (!card) return;
            const idx = gameState.selectedCards.findIndex(c => c.id === cid);
            if (add && idx < 0) gameState.selectedCards.push(card);
            if (!add && idx >= 0) gameState.selectedCards.splice(idx, 1);
            updatePlayerHand();
            updateButtons();
        }

        // ── 下半区：拖拽换位 ──
        function cardDragStart(e, cid) {
            _dragSrcId = cid;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', cid);
        }
        function cardDragOver(e, cid) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            document.querySelectorAll('.hcard.drag-over').forEach(el => el.classList.remove('drag-over'));
            const el = document.querySelector(`.hcard[data-cid="${cid}"]`);
            if (el) el.classList.add('drag-over');
        }
        function cardDragLeave(e) {
            e.currentTarget.closest('.hcard')?.classList.remove('drag-over');
        }
        function cardDrop(e, targetCid) {
            e.preventDefault();
            document.querySelectorAll('.hcard.drag-over').forEach(el => el.classList.remove('drag-over'));
            if (!_dragSrcId || _dragSrcId === targetCid) return;
            const hand = gameState.hands.player;
            // 建立/复用手动排序数组
            if (!gameState.playerHandOrder) {
                gameState.playerHandOrder = [...hand].sort((a, b) => rankValue(b.rank) - rankValue(a.rank));
            }
            const arr = gameState.playerHandOrder;
            const si = arr.findIndex(c => c.id === _dragSrcId);
            const ti = arr.findIndex(c => c.id === targetCid);
            if (si < 0 || ti < 0) return;
            const [moved] = arr.splice(si, 1);
            arr.splice(ti, 0, moved);
            _dragSrcId = null;
            updatePlayerHand();
        }

        function toggleCard(cardId) {
            if (!gameState.gameStarted) return;
            const card = gameState.hands.player.find(c => c.id === cardId);
            if (!card) return;

            const idx = gameState.selectedCards.findIndex(c => c.id === cardId);
            if (idx >= 0) {
                gameState.selectedCards.splice(idx, 1);
            } else {
                gameState.selectedCards.push(card);
            }
            updatePlayerHand();
            updateButtons();
        }

        function updateButtons() {
            const isPlayerTurn = gameState.currentTurn === 'player' && !gameState.finished.includes('player');
            const hasSelection = gameState.selectedCards.length > 0;

            document.getElementById('playBtn').disabled = !isPlayerTurn || !hasSelection;
            document.getElementById('passBtn').disabled = !isPlayerTurn;
        }

        function updateScores() {
            document.getElementById('scoreA').textContent = gameState.scoreA;
            document.getElementById('scoreB').textContent = gameState.scoreB;
        }

        function updateRoundBadge() {
            const roundText = ['一', '二', '三', '四', '五'][gameState.round - 1] || gameState.round;
            document.getElementById('roundBadge').textContent = `第 ${roundText} 局`;
        }

        function updatePlayZone() {
            const zone = document.getElementById('playZone');

            if (!gameState.lastPlay) {
                zone.innerHTML = '<div style="color:rgba(255,255,255,.5);font-size:12px;">等待出牌...</div>';
                return;
            }

            const playerName = SEAT_NAMES[gameState.lastPlay.userId];
            const analysis = gameState.lastPlay.analysis;
            const typeNames = {
                'single': '单张',
                'pair': '对子',
                'straight': '顺子',
                'dragon': '双龙',
                'bomb': '炸弹',
                'yao': '幺',
                'joker_bomb': '王炸'
            };

            const cardsHtml = gameState.lastPlay.cards.map(card => renderPlayCard(card)).join('');

            zone.innerHTML = `
                <div class="pz-who">▶ <em>${playerName}</em> 出牌</div>
                <div class="pz-cards">${cardsHtml}</div>
                <div class="pz-tag">${typeNames[analysis.type] || analysis.type} · ${analysis.lu}路</div>
            `;
        }

        function showPassAnimation(seat) {
            const zone = document.getElementById('playZone');
            const playerName = SEAT_NAMES[seat];
            zone.innerHTML = `
                <div class="pz-who"><em>${playerName}</em></div>
                <div class="no-play">不出</div>
            `;
        }

        function updateOpponents() {
            // Update each opponent's card count and active state
            for (let i = 1; i <= 5; i++) {
                const seat = SEATS[i];
                const handCount = gameState.hands[seat]?.length || 0;
                const isActive = gameState.currentTurn === seat;
                const isFinished = gameState.finished.includes(seat);

                // Update badge
                const badge = document.getElementById(`badge${i}`);
                if (badge) {
                    badge.textContent = isFinished ? '✓' : handCount;
                    badge.classList.toggle('badge-alert', !isFinished && handCount <= 5 && handCount > 0);
                }

                // Update portrait active state
                const seatEl = document.getElementById(`seat${i}`);
                const portrait = seatEl?.querySelector('.portrait');
                if (portrait) {
                    portrait.classList.remove('active-p');
                    if (isActive && !isFinished) {
                        portrait.classList.add('active-p');
                    }
                }

                // Update card fan
                const fan = document.getElementById(`fan${i}`);
                if (fan) {
                    if (isFinished) {
                        fan.innerHTML = '';
                    } else {
                        const cardCount = Math.min(handCount, 8);
                        fan.innerHTML = Array(cardCount).fill('<div class="cf"></div>').join('');
                    }
                }
            }
        }

        function updateActivePlayer() {
            // Clear all active states
            document.querySelectorAll('.portrait').forEach(p => p.classList.remove('active-p'));

            // Set active for current turn
            const currentSeat = gameState.currentTurn;
            const seatIdx = SEATS.indexOf(currentSeat);

            if (seatIdx === 0) {
                // My turn - highlight my avatar
                document.querySelector('.my-av').style.boxShadow = '0 0 15px rgba(255,210,0,.9)';
            } else {
                document.querySelector('.my-av').style.boxShadow = 'none';
                const seatEl = document.getElementById(`seat${seatIdx}`);
                if (seatEl) {
                    const portrait = seatEl.querySelector('.portrait');
                    if (portrait && !gameState.finished.includes(currentSeat)) {
                        portrait.classList.add('active-p');
                    }
                }
            }
        }

        // ==================== Game Logic ====================
        function dealNewGame() {
            const deck = shuffle(createDeck());
            gameState = {
                seats: SEATS,
                hands: {},
                currentTurn: 'player',
                lastPlay: null,
                passCount: 0,
                scoreA: 0,
                scoreB: 0,
                firstFinishTeam: null,
                borrowLight: null,
                log: ['新游戏开始！'],
                finished: [],
                selectedCards: [],
                round: gameState.round || 1,
                gameStarted: true
            };

            // Deal 27 cards to each player
            for (let i = 0; i < 6; i++) {
                gameState.hands[SEATS[i]] = deck.slice(i * 27, (i + 1) * 27);
            }

            document.getElementById('dealBtn').classList.add('hidden');
            updateRoundBadge();
            updatePlayerHand();
            updateOpponents();
            updateScores();
            updatePlayZone();
            updateActivePlayer();
            updateButtons();
            updateLog();

            log('游戏开始！你是A队，先出牌');
            checkTurn();
        }

        function playCards() {
            if (gameState.currentTurn !== 'player') return;

            const cards = gameState.selectedCards;
            const analysis = analyzePlay(cards);

            if (!analysis.valid) {
                alert('无效的出牌组合！');
                return;
            }

            if (!canBeat({ cards, analysis }, gameState.lastPlay)) {
                alert('无法压过上家！');
                return;
            }

            executePlay('player', cards, analysis);
        }

        function passTurn() {
            if (gameState.currentTurn !== 'player') return;
            executePass('player');
        }

        function executePlay(seat, cards, analysis) {
            // Remove cards from hand
            const hand = gameState.hands[seat];
            for (const card of cards) {
                const idx = hand.findIndex(c => c.id === card.id);
                if (idx >= 0) hand.splice(idx, 1);
            }

            // Update last play
            gameState.lastPlay = { userId: seat, cards: [...cards], analysis };
            gameState.passCount = 0;

            // Clear selection
            if (seat === 'player') {
                gameState.selectedCards = [];
            }

            log(`${SEAT_NAMES[seat]} 出了 ${cards.map(c => c.rank + (c.suit === 'joker' ? '' : c.suit)).join(' ')}`);

            // Check if player finished
            if (hand.length === 0 && !gameState.finished.includes(seat)) {
                handlePlayerFinished(seat);
            }

            updateUI();

            // Check win conditions
            if (checkWinConditions()) {
                return;
            }

            // Move to next turn
            nextTurn();
        }

        function executePass(seat) {
            gameState.passCount++;
            log(`${SEAT_NAMES[seat]} 不要`);

            // Show pass animation
            showPassAnimation(seat);

            // Check if all others passed
            if (gameState.passCount >= 5) {
                // BUG FIX: Add score to the team of lastPlay when everyone passes
                if (gameState.lastPlay) {
                    const lastPlayScore = calcScore(gameState.lastPlay.cards);
                    const winningTeam = getTeam(gameState.lastPlay.userId);
                    if (winningTeam === 'A') {
                        gameState.scoreA += lastPlayScore;
                    } else {
                        gameState.scoreB += lastPlayScore;
                    }
                    log(`${SEAT_NAMES[gameState.lastPlay.userId]} 赢得本轮，获得 ${lastPlayScore} 分`);
                }

                log('所有其他玩家都选择不要，新一轮开始');
                gameState.lastPlay = null;
                gameState.passCount = 0;
                updateScores();
                updatePlayZone();
            }

            updateUI();
            nextTurn();
        }

        function handlePlayerFinished(seat) {
            gameState.finished.push(seat);
            const team = getTeam(seat);

            if (!gameState.firstFinishTeam) {
                gameState.firstFinishTeam = team;
                log(`${SEAT_NAMES[seat]} 第一个出完！${team}队暂时领先`);
            } else {
                log(`${SEAT_NAMES[seat]} 出完了`);
            }

            // BUG FIX: Add remaining score cards when a player empties hand
            // The player who emptied their hand wins the round, collect the lastPlay score
            if (gameState.lastPlay) {
                const lastPlayScore = calcScore(gameState.lastPlay.cards);
                if (lastPlayScore > 0) {
                    if (team === 'A') {
                        gameState.scoreA += lastPlayScore;
                    } else {
                        gameState.scoreB += lastPlayScore;
                    }
                    log(`${SEAT_NAMES[seat]} 获得本轮 ${lastPlayScore} 分`);
                }
            }

            // Check for borrow light
            if (gameState.lastPlay && getTeam(gameState.lastPlay.userId) !== team) {
                gameState.borrowLight = {
                    finishedSeat: seat,
                    team: team,
                    opponentsPassed: 0
                };
                log('借光！队友可以继续出牌');
            }

            updateScores();
        }

        function nextTurn() {
            const currentIdx = SEATS.indexOf(gameState.currentTurn);
            let nextIdx = (currentIdx + 1) % 6;

            // Skip finished players
            while (gameState.finished.includes(SEATS[nextIdx])) {
                nextIdx = (nextIdx + 1) % 6;
                if (nextIdx === currentIdx) break;
            }

            gameState.currentTurn = SEATS[nextIdx];
            updateUI();
            checkTurn();
        }

        function checkTurn() {
            if (gameState.finished.length === 6) return;

            if (gameState.currentTurn !== 'player') {
                setTimeout(() => botPlay(gameState.currentTurn), 800);
            }
        }

        // ==================== Bot AI ====================
        function botPlay(botSeat) {
            if (gameState.finished.includes(botSeat)) {
                nextTurn();
                return;
            }

            const hand = gameState.hands[botSeat];
            const lastPlay = gameState.lastPlay;

            let bestPlay = null;
            let bestAnalysis = null;

            const possiblePlays = generatePossiblePlays(hand);

            for (const play of possiblePlays) {
                const analysis = analyzePlay(play);
                if (!analysis.valid) continue;

                if (canBeat({ cards: play, analysis }, lastPlay)) {
                    if (!bestPlay || analysis.lu < bestAnalysis.lu ||
                        (analysis.lu === bestAnalysis.lu && analysis.value < bestAnalysis.value)) {
                        bestPlay = play;
                        bestAnalysis = analysis;
                    }
                }
            }

            if (bestPlay) {
                executePlay(botSeat, bestPlay, bestAnalysis);
            } else {
                executePass(botSeat);
            }
        }

        function generatePossiblePlays(hand) {
            const plays = [];

            // Singles
            for (const card of hand) {
                plays.push([card]);
            }

            // Pairs and bombs
            const rankGroups = {};
            for (const card of hand) {
                if (!rankGroups[card.rank]) rankGroups[card.rank] = [];
                rankGroups[card.rank].push(card);
            }

            for (const [rank, cards] of Object.entries(rankGroups)) {
                if (cards.length >= 2) {
                    for (let i = 0; i < cards.length - 1; i++) {
                        for (let j = i + 1; j < cards.length; j++) {
                            plays.push([cards[i], cards[j]]);
                        }
                    }
                }
                if (cards.length >= 3) {
                    plays.push(cards.slice(0, 3));
                    if (cards.length >= 4) plays.push(cards.slice(0, 4));
                    if (cards.length >= 5) plays.push(cards.slice(0, 5));
                    if (cards.length >= 6) plays.push(cards.slice(0, 6));
                }
            }

            // Straights
            const sortedHand = [...hand].sort((a, b) => rankValue(a.rank) - rankValue(b.rank));
            const nonJokers = sortedHand.filter(c => c.rank !== '小王' && c.rank !== '大王');

            for (let len = 3; len <= 13; len++) {
                for (let start = 0; start <= 13 - len; start++) {
                    const straight = [];
                    let canForm = true;
                    for (let i = 0; i < len; i++) {
                        const targetRank = RANK_ORDER[start + i];
                        const card = nonJokers.find(c => c.rank === targetRank && !straight.includes(c));
                        if (card) {
                            straight.push(card);
                        } else {
                            canForm = false;
                            break;
                        }
                    }
                    if (canForm && straight.length === len) {
                        plays.push(straight);
                    }
                }
            }

            // Dragons
            for (let len = 3; len <= 6; len++) {
                for (let start = 0; start <= 13 - len; start++) {
                    const dragon = [];
                    let canForm = true;
                    for (let i = 0; i < len; i++) {
                        const targetRank = RANK_ORDER[start + i];
                        const cards = nonJokers.filter(c => c.rank === targetRank);
                        if (cards.length >= 2) {
                            dragon.push(cards[0], cards[1]);
                        } else {
                            canForm = false;
                            break;
                        }
                    }
                    if (canForm && dragon.length === len * 2) {
                        plays.push(dragon);
                    }
                }
            }

            // Yao
            const aces = hand.filter(c => c.rank === 'A');
            const fours = hand.filter(c => c.rank === '4');
            if (aces.length >= 1 && fours.length >= 2) {
                for (let n = 2; n <= fours.length; n++) {
                    plays.push([aces[0], ...fours.slice(0, n)]);
                }
            }

            // Joker bombs
            const smallJokers = hand.filter(c => c.rank === '小王');
            const bigJokers = hand.filter(c => c.rank === '大王');

            if (smallJokers.length + bigJokers.length >= 2) {
                for (let i = 0; i < smallJokers.length; i++) {
                    for (let j = 0; j < bigJokers.length; j++) {
                        plays.push([smallJokers[i], bigJokers[j]]);
                    }
                }
                if (smallJokers.length >= 2) plays.push(smallJokers.slice(0, 2));
                if (bigJokers.length >= 2) plays.push(bigJokers.slice(0, 2));
            }

            return plays;
        }

        // ==================== Win Conditions ====================
        function checkWinConditions() {
            if (gameState.finished.length < 6) {
                const teamAFinished = SEATS.filter((s, i) => i % 2 === 0 && gameState.finished.includes(s));
                const teamBFinished = SEATS.filter((s, i) => i % 2 === 1 && gameState.finished.includes(s));

                if (teamAFinished.length === 3 || teamBFinished.length === 3) {
                    endGame(teamAFinished.length === 3 ? 'A' : 'B', '全队出完');
                    return true;
                }
            }
            return false;
        }

        function endGame(winningTeam, reason) {
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('modalTitle');
            const scores = document.getElementById('modalScores');
            const effect = document.getElementById('modalEffect');

            const playerTeam = getTeam('player');
            const playerWon = winningTeam === playerTeam;

            title.textContent = playerWon ? '你赢了！' : '你输了！';
            title.className = 'modal-title ' + (playerWon ? 'win' : 'lose');

            scores.innerHTML = `
                A队: <strong>${gameState.scoreA}</strong> 分<br>
                B队: <strong>${gameState.scoreB}</strong> 分<br>
                <span style="font-size:12px;color:rgba(255,255,255,.5);">${reason}</span>
            `;

            // Calculate effect (大血/小血)
            const scoreDiff = winningTeam === 'A' ? gameState.scoreA - gameState.scoreB : gameState.scoreB - gameState.scoreA;
            if (scoreDiff >= 100) {
                effect.textContent = winningTeam === playerTeam ? '大血！' : '被大血...';
            } else if (scoreDiff >= 50) {
                effect.textContent = winningTeam === playerTeam ? '小血！' : '被小血...';
            } else {
                effect.textContent = '普通胜利';
            }

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('show');
            gameState.round++;
            dealNewGame();
        }

        function showEmoji() {
            log('你发送了一个表情 😄');
        }

        function updateUI() {
            updatePlayerHand();
            updateOpponents();
            updateActivePlayer();
            updatePlayZone();
            updateButtons();
        }

        // ── 画布缩放：适配任意屏幕 ──
        function fitCanvas() {
            const canvas = document.querySelector('.canvas');
            const scale = Math.min(window.innerWidth / 667, window.innerHeight / 375);
            canvas.style.transform = `scale(${scale})`;
            canvas.style.transformOrigin = 'center center';
        }
        window.addEventListener('resize', fitCanvas);
        window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
        fitCanvas();

        // Initialize
        updateLog();
        updateOpponents();
    </script>
</body>
</html>
